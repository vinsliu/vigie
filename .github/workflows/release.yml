name: Release

# Pushing a tag vX.Y.Z on main publishes a GitHub release whose notes are the CHANGELOG section of that version.
# Nothing is published to npm.
#
# Two jobs, so that the one running project code (npm ci runs `prepare`, i.e. the TypeScript build) holds a
# read-only token, and the one holding write access runs no project code at all.
on:
  push:
    tags: ["v*.*.*"]

permissions: {} # nothing by default: each job asks for what it needs

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag matches package.json and sits on main
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./package.json').version")
          if [ "$version" != "$package" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json ($package)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Release from main only."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; no project code runs in this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") { found = 1; next }
            /^## \[/ { found = 0 }
            /^\[[^]]+\]: / { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for version $version."
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --title "Vigie $GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest
