name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Vigie is deliberately small: local only, read-only on Claude's files, no runtime dependency.
        Ideas that fit that are very welcome; please read the ground rules in CONTRIBUTING.md first.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The need, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Vigie to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
