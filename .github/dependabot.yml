version: 2
updates:
  # Dev dependencies only (typescript, @types/node): Vigie has no runtime dependency.
  # Updates land on dev like any other change, never directly on main.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Vigie supports Node 22.18 and later: the types must describe Node 22, not newer APIs.
      # Raising them is a decision tied to raising the minimum Node version, made by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Actions used by the CI and release workflows.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
