<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigie</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="side" id="side" aria-label="Navigation"></aside>
    <div class="col">
      <header>
        <button type="button" id="menu" class="btn menu" aria-label="Open navigation" aria-expanded="false">☰</button>
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search sessions" aria-label="Search sessions" autocomplete="off">
        </div>
        <span id="status" class="status" aria-live="polite"></span>
        <div class="pop-wrap">
          <button type="button" id="theme" class="btn icon-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-pop" title="Theme"></button>
          <div id="theme-pop" class="pop dropdown" role="menu" aria-label="Theme" hidden></div>
        </div>
        <div class="pop-wrap">
          <button type="button" id="accent" class="btn icon-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="accent-pop" aria-label="Accent color" title="Accent color">
            <span class="swatch" aria-hidden="true"></span>
          </button>
          <div id="accent-pop" class="pop" role="dialog" aria-label="Accent color" hidden></div>
        </div>
      </header>
      <main id="app"></main>
    </div>
  </div>
  <div id="tip" role="tooltip"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
